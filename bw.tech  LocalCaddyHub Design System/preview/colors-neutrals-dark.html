<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.ramp{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.step{aspect-ratio:1;border-radius:6px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:flex-end;justify-content:center;padding:4px;font:500 10px var(--font-mono);color:var(--gray-12)}
.row2{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:4px}
.lbl{font:500 10px var(--font-mono);color:var(--fg-3);text-align:center}
</style></head><body>
<div class="card">
  <div class="ramp">
    <div class="step" style="background:#050B12">1</div>
    <div class="step" style="background:#0B1521">2</div>
    <div class="step" style="background:#122031">3</div>
    <div class="step" style="background:#1A2D43">4</div>
    <div class="step" style="background:#243A55">5</div>
    <div class="step" style="background:#324C6B">6</div>
    <div class="step" style="background:#4A6585">7</div>
    <div class="step" style="background:#6B86A6">8</div>
    <div class="step" style="background:#93AAC4;color:#0B1B2B">9</div>
    <div class="step" style="background:#C2D2E3;color:#0B1B2B">10</div>
    <div class="step" style="background:#E1EAF3;color:#0B1B2B">11</div>
    <div class="step" style="background:#F6F9FC;color:#0B1B2B">12</div>
  </div>
  <div style="font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted)">Dark · gray-1 → gray-12 · cool blue-tinted neutrals</div>
</div>
</body></html>
