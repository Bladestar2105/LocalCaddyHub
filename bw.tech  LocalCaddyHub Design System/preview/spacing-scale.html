<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.bar{display:flex;align-items:flex-end;gap:8px;height:140px}
.unit{background:linear-gradient(180deg,#3D8BFF,#1F5FCC);border-radius:4px;display:flex;align-items:flex-end;justify-content:center;color:#fff;font:600 11px var(--font-mono);padding-bottom:6px;min-width:24px}
.lbl{font:500 10px var(--font-mono);color:var(--fg-3);text-align:center;margin-top:4px}
.col{display:flex;flex-direction:column}
</style></head><body>
<div class="card">
  <div class="bar">
    <div class="col"><div class="unit" style="height:4px;width:24px"></div><div class="lbl">4</div></div>
    <div class="col"><div class="unit" style="height:8px;width:24px"></div><div class="lbl">8</div></div>
    <div class="col"><div class="unit" style="height:12px;width:24px"></div><div class="lbl">12</div></div>
    <div class="col"><div class="unit" style="height:16px;width:24px"></div><div class="lbl">16</div></div>
    <div class="col"><div class="unit" style="height:24px;width:24px"></div><div class="lbl">24</div></div>
    <div class="col"><div class="unit" style="height:32px;width:24px"></div><div class="lbl">32</div></div>
    <div class="col"><div class="unit" style="height:48px;width:24px"></div><div class="lbl">48</div></div>
    <div class="col"><div class="unit" style="height:64px;width:32px">64</div><div class="lbl">64</div></div>
    <div class="col"><div class="unit" style="height:96px;width:48px">96</div><div class="lbl">96</div></div>
    <div class="col"><div class="unit" style="height:128px;width:64px">128</div><div class="lbl">128</div></div>
  </div>
  <div style="font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-muted);margin-top:8px">4px base grid · sp-1 → sp-10</div>
</div>
</body></html>
