<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.brand{display:flex;align-items:center;gap:12px;font:800 26px var(--font-sans);letter-spacing:-.01em;color:#F6F9FC}
.dot{width:10px;height:10px;border-radius:50%;background:#3D8BFF}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.tagline{font:600 12px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#6BA8FF}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="brand">BW<span class="dot"></span>Tech</div>
    <div class="tagline">Cloud by Design</div>
  </div>
  <div class="row" style="margin-top:8px">
    <div style="font:500 13px var(--font-mono);color:var(--fg-3)">on dark</div>
  </div>
  <div style="background:#fff;border-radius:8px;padding:18px;display:flex;align-items:center;gap:24px;margin-top:8px">
    <div style="display:flex;align-items:center;gap:12px;font:800 26px var(--font-sans);letter-spacing:-.01em;color:#0B1B2B">BW<span class="dot"></span>Tech</div>
    <div style="font:600 12px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#1F5FCC">Cloud by Design</div>
    <div style="font:500 13px var(--font-mono);color:#5E6F84;margin-left:auto">on light</div>
  </div>
</div>
</body></html>
