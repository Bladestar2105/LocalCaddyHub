<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.box{background:var(--gray-3);border:1px solid var(--gray-5);height:100px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 12px var(--font-mono);color:var(--fg-2)}
.lbl{font:500 11px var(--font-mono);color:var(--fg-3);margin-top:8px;text-align:center}
</style></head><body>
<div class="card">
  <div class="row">
    <div><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.4)">1</div><div class="lbl">shadow-1 · rows</div></div>
    <div><div class="box" style="box-shadow:0 4px 12px rgba(0,0,0,.35)">2</div><div class="lbl">shadow-2 · popovers</div></div>
    <div><div class="box" style="box-shadow:0 12px 32px rgba(0,0,0,.45)">3</div><div class="lbl">shadow-3 · modals</div></div>
    <div><div class="box" style="box-shadow:0 24px 64px rgba(0,0,0,.55)">4</div><div class="lbl">shadow-4 · overlays</div></div>
  </div>
</div>
</body></html>
