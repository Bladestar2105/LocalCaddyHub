<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.ramp{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.step{aspect-ratio:1;border-radius:6px;border:1px solid rgba(11,27,43,.08);display:flex;align-items:flex-end;justify-content:center;padding:4px;font:500 10px var(--font-mono)}
</style></head><body>
<div class="card card-light" style="background:#fff">
  <div class="ramp">
    <div class="step" style="background:#FFFFFF;color:#0B1B2B">1</div>
    <div class="step" style="background:#F6F9FC;color:#0B1B2B">2</div>
    <div class="step" style="background:#EDF2F7;color:#0B1B2B">3</div>
    <div class="step" style="background:#DDE5EE;color:#0B1B2B">4</div>
    <div class="step" style="background:#C2D0DE;color:#0B1B2B">5</div>
    <div class="step" style="background:#93A3B5;color:#fff">6</div>
    <div class="step" style="background:#5E6F84;color:#fff">7</div>
    <div class="step" style="background:#3A4A5E;color:#fff">8</div>
    <div class="step" style="background:#1F2D3F;color:#fff">9</div>
    <div class="step" style="background:#0B1B2B;color:#fff">10</div>
  </div>
  <div style="font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#5E6F84">Light · gray-1-light → gray-10-light · marketing surfaces</div>
</div>
</body></html>
