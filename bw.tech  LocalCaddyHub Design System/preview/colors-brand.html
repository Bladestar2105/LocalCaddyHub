<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.swatch{display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:8px;border:1px solid var(--gray-5)}
.meta{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.name{font-size:13px;font-weight:600;color:var(--fg)}
</style></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(5,1fr)">
    <div class="swatch"><div class="chip" style="background:#0B1B2B"></div><div class="name">Navy</div><div class="meta"><span>brand-navy</span><span>#0B1B2B</span></div></div>
    <div class="swatch"><div class="chip" style="background:#3D8BFF"></div><div class="name">Blue</div><div class="meta"><span>brand-blue</span><span>#3D8BFF</span></div></div>
    <div class="swatch"><div class="chip" style="background:#2EBFA5"></div><div class="name">Teal</div><div class="meta"><span>brand-teal</span><span>#2EBFA5</span></div></div>
    <div class="swatch"><div class="chip" style="background:#F5A524"></div><div class="name">Amber</div><div class="meta"><span>brand-amber</span><span>#F5A524</span></div></div>
    <div class="swatch"><div class="chip" style="background:#E5484D"></div><div class="name">Crimson</div><div class="meta"><span>brand-crimson</span><span>#E5484D</span></div></div>
  </div>
</div>
</body></html>
