<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--gray-5);padding:10px 0}
.row:last-child{border-bottom:0}
.size{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:80px;flex-shrink:0}
.sample{flex:1}
.tag{font:500 10px var(--font-mono);color:var(--fg-muted)}
</style></head><body>
<div class="card">
  <div class="row"><div class="size">32 / 700</div><div class="sample" style="font:700 32px/1.25 var(--font-sans);letter-spacing:-.01em">Heading 1 — sektion</div></div>
  <div class="row"><div class="size">24 / 600</div><div class="sample" style="font:600 24px/1.25 var(--font-sans)">Heading 2 — Domains &amp; Subdomains</div></div>
  <div class="row"><div class="size">20 / 600</div><div class="sample" style="font:600 20px/1.25 var(--font-sans)">Heading 3 — Process Control</div></div>
  <div class="row"><div class="size">16 / 400</div><div class="sample" style="font:400 16px/1.5 var(--font-sans)">Body — Konfigurationen werden in einer SQLite-Datenbank gespeichert.</div></div>
  <div class="row"><div class="size">14 / 400</div><div class="sample" style="font:400 14px/1.5 var(--font-sans);color:var(--fg-2)">Small — Help text and table content. (?) Default duration to wait for the next request.</div></div>
</div>
</body></html>
