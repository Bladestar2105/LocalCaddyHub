<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.row{display:flex;gap:16px;align-items:center}
.box{background:var(--gray-3);border:1px solid var(--gray-5);width:88px;height:88px;display:flex;align-items:center;justify-content:center;font:600 12px var(--font-mono);color:var(--fg-2)}
.lbl{font:500 11px var(--font-mono);color:var(--fg-3);margin-top:6px;text-align:center}
.col{display:flex;flex-direction:column;gap:0;align-items:center}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="col"><div class="box" style="border-radius:4px">4</div><div class="lbl">radius-1</div></div>
    <div class="col"><div class="box" style="border-radius:8px">8</div><div class="lbl">radius-2</div></div>
    <div class="col"><div class="box" style="border-radius:12px">12</div><div class="lbl">radius-3</div></div>
    <div class="col"><div class="box" style="border-radius:9999px;width:120px">pill</div><div class="lbl">radius-pill</div></div>
  </div>
</div>
</body></html>
