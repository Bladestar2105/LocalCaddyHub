<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
.row{display:flex;align-items:center;gap:16px;background:var(--gray-3);border:1px solid var(--gray-5);border-radius:8px;padding:14px 16px}
.glyph{width:44px;height:44px;border-radius:8px;background:#0B1521;border:1px solid var(--gray-5);display:flex;align-items:center;justify-content:center}
.title{font:700 18px var(--font-sans);letter-spacing:-.01em;color:#F6F9FC}
.sub{font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#6BA8FF;margin-top:2px}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="glyph">
      <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
        <g stroke="#3D8BFF" stroke-width="3" fill="#0B1521"><circle cx="20" cy="22" r="6"/><circle cx="44" cy="22" r="6"/><circle cx="20" cy="44" r="6"/><circle cx="44" cy="44" r="6"/></g>
        <g stroke="#2EBFA5" stroke-width="3"><line x1="26" y1="22" x2="38" y2="22"/><line x1="26" y1="44" x2="38" y2="44"/><line x1="20" y1="28" x2="20" y2="38"/><line x1="44" y1="28" x2="44" y2="38"/></g>
      </svg>
    </div>
    <div>
      <div class="title">LocalCaddyHub</div>
      <div class="sub">by BW.Tech · v2.0</div>
    </div>
  </div>
</div>
</body></html>
