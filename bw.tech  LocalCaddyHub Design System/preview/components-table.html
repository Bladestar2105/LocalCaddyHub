<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>
table{width:100%;border-collapse:collapse;font:400 13px var(--font-sans)}
th{font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:10px 12px;background:var(--gray-3);border-bottom:1px solid var(--gray-5)}
td{padding:12px;border-bottom:1px solid var(--gray-5);color:var(--fg-2)}
tr:hover td{background:var(--gray-3)}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:9999px;font:600 11px var(--font-sans)}
.dot{width:6px;height:6px;border-radius:50%}
</style></head><body>
<div class="card" style="padding:0;background:var(--gray-2)">
  <table>
    <thead><tr><th>En</th><th>Domain</th><th>Port</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td><input type="checkbox" checked></td><td class="mono">bw.tech</td><td class="mono">443</td><td><span class="badge" style="background:rgba(46,191,165,.14);color:#5BD3BD"><span class="dot" style="background:#2EBFA5"></span>Running</span></td></tr>
      <tr><td><input type="checkbox" checked></td><td class="mono">helpdesk.bw-tech.de</td><td class="mono">443</td><td><span class="badge" style="background:rgba(245,165,36,.16);color:#F5A524"><span class="dot" style="background:#F5A524"></span>Reload</span></td></tr>
      <tr><td><input type="checkbox"></td><td class="mono">staging.bw.tech</td><td class="mono">8443</td><td><span class="badge" style="background:rgba(229,72,77,.14);color:#FF7B7F"><span class="dot" style="background:#E5484D"></span>Stopped</span></td></tr>
    </tbody>
  </table>
</div>
</body></html>
