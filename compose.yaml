services:
  localcaddyhub:
    image: ghcr.io/ssakalis/localcaddyhub:latest
    restart: unless-stopped
    environment:
      ADMIN_USER: ${ADMIN_USER:?Set the initial administrator username}
      ADMIN_PASS: ${ADMIN_PASS:?Set a strong initial administrator password}
    ports:
      - "127.0.0.1:8090:8090"
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./data:/app/data
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
