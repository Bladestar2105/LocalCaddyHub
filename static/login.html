<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalCaddyHub</title>
    <link rel="icon" href="/img/lch-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="login-container">
    <select id="languageSelect" class="form-select form-select-sm mb-3" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>
    <h2 class="text-center mb-4">LocalCaddyHub</h2>
    <div id="errorMsg" class="error-msg text-center" role="alert" aria-live="assertive">Invalid username or password</div>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="mb-3" id="totpGroup" style="display: none;">
            <label for="totp" class="form-label">2FA Code</label>
            <input type="text" class="form-control" id="totp" name="totp" placeholder="123456" autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn">Login</button>
    </form>
</div>

<script src="/i18n.js"></script>
<script>
    const i18n = window.LocalCaddyHubI18n || { init() {}, t(text) { return text; } };
    i18n.init();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const btn = document.getElementById('loginSubmitBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + i18n.t('Logging in...');

        try {
            const res = await fetch('/login', {
                method: 'POST',
                body: new URLSearchParams(formData), // Send as form URL encoded
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            });

            if (res.ok) {
                const data = await res.json();
                if (data.needsSetup) {
                    window.location.href = '/setup.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                const data = await res.json();
                if (data.error === 'invalid_totp') {
                    document.getElementById('totpGroup').style.display = 'block';
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid 2FA code.');
                    document.getElementById('errorMsg').style.display = 'block';
                } else {
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid username or password');
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('errorMsg').textContent = i18n.t('Error occurred during login.');
            document.getElementById('errorMsg').style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
