<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalCaddyHub</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/theme.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/lch-icon.svg">
</head>
<body class="auth-shell">

<main class="auth-card login-container">
    <div class="auth-brand"><img src="/assets/lch-icon.svg" width="44" height="44" alt=""><div><span class="brand-name">LocalCaddyHub</span><span class="brand-byline">by <strong>BW.Tech</strong></span></div></div>
    <select id="languageSelect" class="form-select form-select-sm mb-3" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to manage your Caddy workspace.</p>
    <div id="errorMsg" class="error-msg text-center" role="alert" aria-live="assertive">Invalid username or password</div>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
        </div>
        <div class="mb-3" id="totpGroup" style="display: none;">
            <label for="totp" class="form-label">2FA Code</label>
            <input type="text" class="form-control" id="totp" name="totp" placeholder="123456" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn">Login</button>
    </form>
    <div class="auth-footer">Cloud by Design. <span>BW.Tech</span></div>
</main>

<script src="/i18n.js"></script>
<script>
    const i18n = window.LocalCaddyHubI18n || { init() {}, t(text) { return text; } };
    i18n.init();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const btn = document.getElementById('loginSubmitBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + i18n.t('Logging in...');

        try {
            const res = await fetch('/login', {
                method: 'POST',
                body: new URLSearchParams(formData), // Send as form URL encoded
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            });

            if (res.ok) {
                const data = await res.json();
                if (data.needsSetup) {
                    window.location.href = '/setup.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                const data = await res.json();
                if (data.error === 'invalid_totp') {
                    document.getElementById('totpGroup').style.display = 'block';
                    document.getElementById('totp').required = true;
                    document.getElementById('totp').focus();
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid 2FA code.');
                    document.getElementById('errorMsg').style.display = 'block';
                } else {
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid username or password');
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('errorMsg').textContent = i18n.t('Error occurred during login.');
            document.getElementById('errorMsg').style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
