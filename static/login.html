<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalCaddyHub</title>
    <link rel="icon" href="/img/lch-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <svg class="glyph" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <rect width="64" height="64" rx="12" fill="#0B1521"/>
                <g stroke="#3D8BFF" stroke-width="3" fill="#0B1521">
                    <circle cx="20" cy="22" r="6"/><circle cx="44" cy="22" r="6"/>
                    <circle cx="20" cy="44" r="6"/><circle cx="44" cy="44" r="6"/>
                </g>
                <g stroke="#2EBFA5" stroke-width="3">
                    <line x1="26" y1="22" x2="38" y2="22"/><line x1="26" y1="44" x2="38" y2="44"/>
                    <line x1="20" y1="28" x2="20" y2="38"/><line x1="44" y1="28" x2="44" y2="38"/>
                </g>
            </svg>
            <div>
                <div class="name">LocalCaddyHub</div>
                <div class="sub">by BW.Tech</div>
            </div>
        </div>

        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-sub">Sign in to manage your Caddy instance.</p>

        <div id="errorMsg" class="auth-error" role="alert" aria-live="assertive">Invalid username or password</div>

        <form id="loginForm" class="d-flex flex-column gap-4" novalidate>
            <div class="field">
                <label class="field-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label class="field-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div class="field" id="totpGroup" style="display: none;">
                <label class="field-label" for="totp">2FA Code</label>
                <input type="text" class="form-control mono" id="totp" name="totp" placeholder="123456" autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn btn-primary w-100" id="loginSubmitBtn" style="padding:12px 14px;justify-content:center;">Login</button>
        </form>

        <div class="auth-foot">
            <span class="muted" style="font-size:12px;">Default: admin / admin</span>
            <select id="languageSelect" class="form-select form-select-sm" aria-label="Language" style="width:auto;">
                <option value="en">EN</option>
                <option value="de">DE</option>
            </select>
        </div>
    </div>
</main>

<script src="/i18n.js"></script>
<script>
    const i18n = window.LocalCaddyHubI18n || { init() {}, t(text) { return text; } };
    i18n.init();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const btn = document.getElementById('loginSubmitBtn');
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + i18n.t('Logging in...');

        try {
            const res = await fetch('/login', {
                method: 'POST',
                body: new URLSearchParams(formData), // Send as form URL encoded
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                }
            });

            if (res.ok) {
                const data = await res.json();
                if (data.needsSetup) {
                    window.location.href = '/setup.html';
                } else {
                    window.location.href = '/';
                }
            } else {
                const data = await res.json();
                if (data.error === 'invalid_totp') {
                    document.getElementById('totpGroup').style.display = 'block';
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid 2FA code.');
                    document.getElementById('errorMsg').style.display = 'block';
                } else {
                    document.getElementById('errorMsg').textContent = i18n.t('Invalid username or password');
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        } catch (error) {
            console.error('Login error:', error);
            document.getElementById('errorMsg').textContent = i18n.t('Error occurred during login.');
            document.getElementById('errorMsg').style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
