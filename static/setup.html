<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - LocalCaddyHub</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/theme.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/assets/lch-icon.svg">
</head>
<body class="auth-shell">

<main class="auth-card setup-container">
    <div class="auth-brand"><img src="/assets/lch-icon.svg" width="44" height="44" alt=""><div><span class="brand-name">LocalCaddyHub</span><span class="brand-byline">by <strong>BW.Tech</strong></span></div></div>
    <select id="languageSelect" class="form-select form-select-sm mb-3" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
    </select>
    <h1 class="auth-title">First Time Setup</h1>
    <p class="auth-sub">Please change your admin credentials.</p>
    <div id="errorMsg" class="error-msg text-center" role="alert" aria-live="assertive">Passwords do not match.</div>
    <form id="setupForm">
        <div class="mb-3">
            <label for="newUsername" class="form-label">New Username</label>
            <input type="text" class="form-control" id="newUsername" name="newUsername" autocomplete="username" required value="admin">
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" aria-describedby="passwordHelp" autocomplete="new-password" minlength="12" required>
            <small id="passwordHelp" class="text-muted">Use at least 12 characters.</small>
        </div>
        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" minlength="12" required>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="setupSubmitBtn">Save & Continue</button>
    </form>
    <div class="auth-footer">Cloud by Design. <span>BW.Tech</span></div>
</main>

<script src="/i18n.js"></script>
<script>
    const i18n = window.LocalCaddyHubI18n || { init() {}, t(text) { return text; } };
    i18n.init();

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('newUsername').value;
        const pass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        const btn = document.getElementById('setupSubmitBtn');
        if (pass !== confirm) {
            document.getElementById('errorMsg').textContent = i18n.t('Passwords do not match.');
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + i18n.t('Saving...');

        try {
            const res = await fetch('/api/setup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ newUsername: username, newPassword: pass })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('errorMsg').textContent = i18n.t('Failed to save.');
                document.getElementById('errorMsg').style.display = 'block';
            }
        } catch (error) {
            console.error('Setup error:', error);
            document.getElementById('errorMsg').textContent = i18n.t('Error: ') + error.message;
            document.getElementById('errorMsg').style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
