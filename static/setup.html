<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - LocalCaddyHub</title>
    <link rel="icon" href="/img/lch-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<main class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <svg class="glyph" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <rect width="64" height="64" rx="12" fill="#0B1521"/>
                <g stroke="#3D8BFF" stroke-width="3" fill="#0B1521">
                    <circle cx="20" cy="22" r="6"/><circle cx="44" cy="22" r="6"/>
                    <circle cx="20" cy="44" r="6"/><circle cx="44" cy="44" r="6"/>
                </g>
                <g stroke="#2EBFA5" stroke-width="3">
                    <line x1="26" y1="22" x2="38" y2="22"/><line x1="26" y1="44" x2="38" y2="44"/>
                    <line x1="20" y1="28" x2="20" y2="38"/><line x1="44" y1="28" x2="44" y2="38"/>
                </g>
            </svg>
            <div>
                <div class="name">LocalCaddyHub</div>
                <div class="sub">by BW.Tech</div>
            </div>
        </div>

        <div class="steps" aria-label="Setup progress">
            <span class="dot is-active"></span>
            <span>Step 1 of 1 · Admin credentials</span>
        </div>

        <h1 class="auth-title">First Time Setup</h1>
        <p class="auth-sub">Please change your admin credentials.</p>

        <div id="errorMsg" class="auth-error" role="alert" aria-live="assertive">Passwords do not match.</div>

        <form id="setupForm" class="d-flex flex-column gap-4" novalidate>
            <div class="field">
                <label class="field-label" for="newUsername">New Username</label>
                <input type="text" class="form-control" id="newUsername" name="newUsername" autocomplete="username" required value="admin">
            </div>
            <div class="field">
                <label class="field-label" for="newPassword">New Password</label>
                <input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password" required>
            </div>
            <div class="field">
                <label class="field-label" for="confirmPassword">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="setupSubmitBtn" style="padding:12px 14px;justify-content:center;">Save &amp; Continue</button>
        </form>

        <div class="auth-foot">
            <span class="muted" style="font-size:12px;">Pick a strong, unique password.</span>
            <select id="languageSelect" class="form-select form-select-sm" aria-label="Language" style="width:auto;">
                <option value="en">EN</option>
                <option value="de">DE</option>
            </select>
        </div>
    </div>
</main>

<script src="/i18n.js"></script>
<script>
    const i18n = window.LocalCaddyHubI18n || { init() {}, t(text) { return text; } };
    i18n.init();

    document.getElementById('setupForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('newUsername').value;
        const pass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        const btn = document.getElementById('setupSubmitBtn');
        if (pass !== confirm) {
            document.getElementById('errorMsg').style.display = 'block';
            return;
        }

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> ' + i18n.t('Saving...');

        try {
            const res = await fetch('/api/setup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify({ newUsername: username, newPassword: pass })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                document.getElementById('errorMsg').textContent = i18n.t('Failed to save.');
                document.getElementById('errorMsg').style.display = 'block';
            }
        } catch (error) {
            console.error('Setup error:', error);
            document.getElementById('errorMsg').textContent = i18n.t('Error: ') + error.message;
            document.getElementById('errorMsg').style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
