name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm audit --omit=dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/modules/caddystarttls/go.mod
          cache-dependency-path: src/modules/caddystarttls/go.sum
      - name: Verify SMTP module
        working-directory: src/modules/caddystarttls
        run: |
          go test -mod=readonly -race ./...
          go vet -mod=readonly ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: localcaddyhub:verify
          load: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: src/modules/caddystarttls/go.sum
      - name: Scan complete custom Caddy binary
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          container=$(docker create localcaddyhub:verify)
          trap 'docker rm -v "$container"' EXIT
          docker cp "$container:/usr/bin/caddy" ./caddy-scan
          govulncheck -mode=binary ./caddy-scan
      - name: Verify native SQLite and application in image
        run: |
          docker run --rm -e LCH_APP_ROOT=/app -e NODE_PATH=/app/node_modules \
            -v "$PWD/tests:/checks:ro" localcaddyhub:verify node --test /checks/runtime.test.cjs
          docker run --rm localcaddyhub:verify caddy version
          docker run --rm localcaddyhub:verify caddy list-modules | tee modules.txt
          grep -Fx http.handlers.waf modules.txt
          grep -Fx http.reverse_proxy.transport.http_ntlm modules.txt
          grep -Fx layer4.handlers.starttls modules.txt
          grep -Fx layer4.handlers.upstream_starttls modules.txt
      - name: Verify real proxy, WAF, TLS and Exchange-like traffic
        run: |
          docker run --rm -e LCH_APP_ROOT=/app -e CADDY_BIN=/usr/bin/caddy \
            -v "$PWD/tests:/checks:ro" localcaddyhub:verify node --test /checks/proxy.test.cjs
      - name: Verify real application and Caddy startup
        run: |
          container=$(docker run -d -e ADMIN_USER=ci-admin -e ADMIN_PASS=ci-only-long-password localcaddyhub:verify)
          trap 'docker logs "$container"; docker rm -fv "$container"' EXIT
          for _ in $(seq 1 30); do
            if docker exec "$container" node -e 'Promise.all([fetch("http://127.0.0.1:8090/login.html"), fetch("http://127.0.0.1:2019/config/", {headers:{Origin:"http://localhost:2019"}})]).then(rs => {if(rs.some(r=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ssakalis/localcaddyhub:latest
